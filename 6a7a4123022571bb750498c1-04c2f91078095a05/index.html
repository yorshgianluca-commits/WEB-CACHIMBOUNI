<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b0d" />
    <meta name="description" content="CachimboUNI: teoria, libros y practica para prepararte para el examen de admision de la Universidad Nacional de Ingenieria." />
    <title>CachimboUNI | Tu ruta hacia la UNI</title>
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = localStorage.getItem("cachimbo-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#eef2f9" : "#080b0d");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
